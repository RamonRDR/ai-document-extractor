name: Format feature branch
on:
  push:
    branches: ["feat/**"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff>=0.13,<1"
      - name: Apply safe lint fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Commit formatting on the same feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: normalize source formatting"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
